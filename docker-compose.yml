services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bloodconnect
      POSTGRES_PASSWORD: bloodconnect
      POSTGRES_DB: bloodconnect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build: ./backend
    command: python seed.py
    environment:
      DATABASE_URL: postgresql+psycopg2://bloodconnect:bloodconnect@db:5432/bloodconnect
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment or .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bloodconnect:bloodconnect@db:5432/bloodconnect
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment or .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
